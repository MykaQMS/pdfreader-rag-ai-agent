[project]
name = "pdf-rag-ai-agent"
version = "0.1.0"
description = "Arquitetura RAG orientada a eventos para consulta em documentos PDF com Inngest, Qdrant e OpenAI"
readme = "README.md"
authors = [
    { name = "Mykael Querido", email = "mykaqms@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.24",
    "llama-index-readers-file>=0.7.0",
    "openai>=3.13.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
pdf-rag-ai-agent = "pdf_rag_ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["."]

